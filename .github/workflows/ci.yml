name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` (runs via postinstall) can resolve
      # a connection string - no live database is required for lint/typecheck/test.
      DATABASE_URL: "postgresql://user:password@localhost:5432/dmlogistics"
      NEXTAUTH_SECRET: "ci-only-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
